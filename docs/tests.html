<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tests · Umbrella JS</title>
  <meta name="description" content="The Umbrella JS test suite, running live in your browser">
  <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/gh/franciscop/umbrella@master/docs/logo.svg">
  <!-- The site's own stylesheet and nav, so this page matches the rest of the
       docs. Both are served by documentation.page from the same host. -->
  <link rel="stylesheet" href="/style.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/franciscop/umbrella@master/docs/vendor/mocha.css">
  <style>
    /* mocha.css restyles `body` and pins its stats box to the top of the
       viewport, where the site nav lives. Undo both. */
    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-body), sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: var(--text);
      background: var(--card);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.7rem;
    }
    .intro {
      margin: 0 0 24px;
      color: var(--text-soft);
    }
    #mocha {
      margin: 0;
      font-family: var(--font-body), sans-serif;
      color: var(--text);
    }
    #mocha h1, #mocha h2 { font-size: 1rem; }
    #mocha h1 a, #mocha .test h2 { color: var(--text); }
    #mocha .suite a { color: var(--text); }
    #mocha-stats {
      top: calc(var(--nav-h, 52px) + 12px);
      z-index: 1;
      color: var(--text-soft);
    }
    #mocha-stats li { color: var(--text-soft); }
    #mocha pre {
      background: var(--code-bg);
      border: 0;
      box-shadow: none;
      color: var(--text);
    }
    /* The fixtures the suite runs against, never meant to be visible */
    #demo { display: none; }
    @media (max-width: 60em) {
      #mocha-stats { position: static; }
    }
  </style>
</head>
<body>
  <nav class="site">
    <div class="nav-inner">
      <a href="/" class="brand">
        <img src="https://cdn.jsdelivr.net/gh/franciscop/umbrella@master/docs/logo.svg" alt="">
        <span>Umbrella JS</span>
      </a>
      <input id="site-nav" type="checkbox" class="nav-toggle">
      <label for="site-nav" class="burger" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <line x1="4" y1="7" x2="20" y2="7"></line>
          <line x1="4" y1="12" x2="20" y2="12"></line>
          <line x1="4" y1="17" x2="20" y2="17"></line>
        </svg>
      </label>
      <div class="site-links">
        <a href="https://github.com/franciscop/umbrella">Github</a>
        <a href="/tests" class="active">Tests</a>
        <a href="/documentation">Documentation</a>
      </div>
    </div>
  </nav>

  <main>
    <h1>Tests for Umbrella JS</h1>
    <p class="intro">The full suite, running in your browser against the published library.</p>

    <div id="mocha"></div>
    <div id="messages"></div>
    <div id="fixtures"></div>

    <div id="demo" class="demo">
      <div id="base" class="base">
        <ul>
          <li><a id="world" class="hello world">Hello world</a></li>
          <li><a>Hello world</a></li>
          <li><a>Hello world</a></li>
        </ul>
        <form class="login" method="POST" action="/test">
          <input name="name" value="John">
          <input name="email" required>
          <input>
          <input name="other" type="checkbox">
          <input type="submit" value="Send!">
        </form>

        <form class="clone">
          <input type="text">
          <input type="checkbox">
          <input type="radio">
          <select name="options">
            <option value="a" selected>A</option>
            <option value="b">B</option>
            <option value="c">C</option>
          </select>
          <textarea></textarea>
        </form>
        <div class="destination"></div>

        <p>Lorem <em>ipsum</em></p>
      </div>

      <table class="performance">
        <tr>
          <th>Test 1</th>
          <th>Test 2</th>
          <th>Test 3</th>
          <th>Test 4</th>
        </tr>
      </table>

      <table class="tbl"></table>

      <!-- `.find()` and `.select()` count the single `.brand a` on the page -->
      <div class="brand"><a href="/">Umbrella JS</a></div>
    </div>
  </main>

  <script>
    // This page has two lives. Opened from disk (grunt's headless Chrome run) it
    // loads the files just built in this working copy, so a run tests the code
    // you are about to push. Served on the web it loads the published library
    // and suite from the CDN, since there is nothing local to point at.
    var LOCAL = location.protocol === 'file:';
    var GH = 'https://cdn.jsdelivr.net/gh/franciscop/umbrella@master/docs/';
    var load = function (path) {
      document.write('<script src="' + path + '"><\/script>');
    };

    ['vendor/mocha.js', 'vendor/chai.js', 'vendor/sinon.js', 'vendor/jquery.js', 'vendor/polyfill.js']
      .forEach(function (file) { load(LOCAL ? './' + file : GH + file); });

    load(LOCAL ? '../umbrella.min.js' : 'https://cdn.jsdelivr.net/npm/umbrellajs');
  </script>
  <script>
    mocha.setup('bdd');
    var base = u("#base");
  </script>
  <script>
    load(LOCAL ? './test.js' : GH + 'test.js');
  </script>
  <script>
    mocha.run();
  </script>
</body>
</html>
