<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tests · Umbrella JS</title>
  <meta name="description" content="The Umbrella JS test suite, running live in your browser">
  <link rel="icon" href="https://cdn.jsdelivr.net/gh/franciscop/umbrella@master/docs/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/franciscop/umbrella@master/docs/vendor/mocha.css">
  <style>
    :root {
      --text: #1a1a2e;
      --soft: #565672;
      --line: #e3e3ee;
    }
    body {
      margin: 0;
      padding: 0 16px 80px;
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: #fff;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 0 16px;
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 1.6rem; }
    header a { color: #06c; }
    main { max-width: 960px; margin: 0 auto; }
    #mocha { margin-top: 24px; font-family: inherit; }
    #mocha h2 { font-size: 1rem; }
    #mocha-stats { top: 16px; }
    /* The fixtures the suite runs against, never meant to be visible */
    #demo { display: none; }
    @media (max-width: 60em) {
      #mocha-stats { position: static; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Tests for Umbrella JS</h1>
    <a href="/">← Umbrella JS</a>
  </header>

  <main>
    <div id="mocha"></div>
    <div id="messages"></div>
    <div id="fixtures"></div>

    <div id="demo" class="demo">
      <div id="base" class="base">
        <ul>
          <li><a id="world" class="hello world">Hello world</a></li>
          <li><a>Hello world</a></li>
          <li><a>Hello world</a></li>
        </ul>
        <form class="login" method="POST" action="/test">
          <input name="name" value="John">
          <input name="email" required>
          <input>
          <input name="other" type="checkbox">
          <input type="submit" value="Send!">
        </form>

        <form class="clone">
          <input type="text">
          <input type="checkbox">
          <input type="radio">
          <select name="options">
            <option value="a" selected>A</option>
            <option value="b">B</option>
            <option value="c">C</option>
          </select>
          <textarea></textarea>
        </form>
        <div class="destination"></div>

        <p>Lorem <em>ipsum</em></p>
      </div>

      <table class="performance">
        <tr>
          <th>Test 1</th>
          <th>Test 2</th>
          <th>Test 3</th>
          <th>Test 4</th>
        </tr>
      </table>

      <table class="tbl"></table>
    </div>
  </main>

  <!-- Everything is loaded from the repo's `master` through jsdelivr, so this
       page runs the published build. The local `docs/tests.html` is the one CI
       runs, against the freshly built files. -->
  <script src="https://cdn.jsdelivr.net/gh/franciscop/umbrella@master/docs/vendor/mocha.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/franciscop/umbrella@master/docs/vendor/chai.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/franciscop/umbrella@master/docs/vendor/sinon.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/franciscop/umbrella@master/docs/vendor/jquery.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/franciscop/umbrella@master/docs/vendor/polyfill.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/franciscop/umbrella@master/umbrella.min.js"></script>
  <script>
    mocha.setup('bdd');
    var base = u("#base");
  </script>
  <script src="https://cdn.jsdelivr.net/gh/franciscop/umbrella@master/docs/test.js"></script>
  <script>
    mocha.run();
  </script>
</body>
</html>
